name: fetch-photos
on:
  push:
    branches: [tmp-fotos-subasta]
    paths: ['fetch/jobs.json', 'fetch/fetch.py', '.github/workflows/fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-photos
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: fetch
        env:
          SHARD: ${{ matrix.shard }}
          NSHARDS: 3
        run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          python fetch/fetch.py
